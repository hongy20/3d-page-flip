<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebBook 3D</title>
  </head>
  <body>
    <fieldset class="controls" aria-label="Reader controls">
      <legend class="sr-only">Reader controls</legend>
      <div class="controls__group" role="radiogroup" aria-label="Transition mode">
        <label class="controls__option">
          <input type="radio" name="mode" value="slide" checked />
          <span>Slide</span>
        </label>
        <label class="controls__option">
          <input type="radio" name="mode" value="stack" />
          <span>Stack</span>
        </label>
        <label class="controls__option">
          <input type="radio" name="mode" value="curl" />
          <span>Curl</span>
        </label>
      </div>
    </fieldset>
    <canvas id="book-canvas" class="stage" content="drawable">
      <main class="book" drawable aria-label="WebBook 3D Reader">
        <section class="page" aria-label="Page 1">
          <div class="page__frame">
            <article class="page__content" drawable>
              <div class="page__svg-slot" data-svg="pages/page_1.svg"></div>
              <button type="button" class="page__badge" aria-label="Bookmark page 1">
                Page 1 / 18
              </button>
            </article>
          </div>
        </section>
        <section class="page" aria-label="Page 2">
